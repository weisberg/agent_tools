[package]
name = "notionli"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Agent-safe Notion control-plane CLI"
license = "MIT"
repository = "https://github.com/weisberg/agent_tools"
readme = "README.md"
keywords = ["notion", "cli", "agents", "automation"]
categories = ["command-line-utilities"]
include = [
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "CHANGELOG.md",
  "SKILL.md",
  "scripts/**/*.sh",
  "src/**/*.rs",
  "tests/**/*.rs",
]

[[bin]]
name = "notionli"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
