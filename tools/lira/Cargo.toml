[workspace]
members = [
  "crates/lira-core",
  "crates/lira-store",
  "crates/lira-index",
  "crates/lira-jira",
  "crates/lira-github",
  "crates/lira-format",
  "crates/lira-agent",
  "crates/lira-cli",
  "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
